<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Delegate a task in Todoist with the @claude label, run /todoist-agent:run so Claude Code does the work on your machine, then review the result comment back in Todoist.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    .task    { animation-name: task; }
    .pill1   { animation-name: pill1; }
    .pill2   { animation-name: pill2; }
    .pill3   { animation-name: pill3; }
    .chip1   { animation-name: pill1; }
    .chip2   { animation-name: pill2; }
    .chip3   { animation-name: pill3; }
    .dotTop  { animation-name: dotTop; }
    .dotBot  { animation-name: dotBot; }
    .term    { animation-name: term; }
    .cover   { animation-name: cover; }
    .l2      { animation-name: l2; }
    .l3      { animation-name: l3; }
    .l4      { animation-name: l4; }
    .l5      { animation-name: l5; }
    .bar     { animation-name: bar; transform-box: fill-box; transform-origin: left center; }
    .comment { animation-name: comment; }

    @keyframes task    { 0%, 95% { opacity: 1 } 97%, 98% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes pill1   { 0%, 29% { opacity: 1 } 32%, 98% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes pill2   { 0%, 29% { opacity: 0 } 32%, 66% { opacity: 1 } 69%, 100% { opacity: 0 } }
    @keyframes pill3   { 0%, 66% { opacity: 0 } 69%, 95% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes dotTop  { 0%, 25% { opacity: 0; transform: translateX(0) } 26% { opacity: 1; transform: translateX(0) }
                         33% { opacity: 1; transform: translateX(112px) } 34%, 100% { opacity: 0; transform: translateX(112px) } }
    @keyframes dotBot  { 0%, 65% { opacity: 0; transform: translateX(0) } 66% { opacity: 1; transform: translateX(0) }
                         72% { opacity: 1; transform: translateX(-112px) } 73%, 100% { opacity: 0; transform: translateX(-112px) } }
    @keyframes term    { 0%, 95% { opacity: 1 } 97%, 99% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes cover   { 0%, 34% { transform: translateX(0) } 42%, 98% { transform: translateX(180px) } 99%, 100% { transform: translateX(0) } }
    @keyframes l2      { 0%, 42% { opacity: 0 } 44%, 100% { opacity: 1 } }
    @keyframes l3      { 0%, 45% { opacity: 0 } 47%, 100% { opacity: 1 } }
    @keyframes bar     { 0%, 47% { transform: scaleX(0) } 60%, 98% { transform: scaleX(1) } 99%, 100% { transform: scaleX(0) } }
    @keyframes l4      { 0%, 60% { opacity: 0 } 62%, 100% { opacity: 1 } }
    @keyframes l5      { 0%, 63% { opacity: 0 } 65%, 100% { opacity: 1 } }
    @keyframes comment { 0%, 71% { opacity: 0; transform: translateY(8px) } 74%, 95% { opacity: 1; transform: translateY(0) }
                         97%, 100% { opacity: 0; transform: translateY(0) } }
  </style>

  <!-- card -->
  <rect x="0" y="0" width="1000" height="470" rx="18" fill="#111318"/>

  <!-- step pills -->
  <g>
    <rect x="200" y="20" width="180" height="50" rx="25" fill="#1f2430" stroke="#2f3542"/>
    <rect class="a pill1" x="200" y="20" width="180" height="50" rx="25" fill="#af38eb"/>
    <text x="290" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1  Delegate</text>
    <text x="290" y="59" text-anchor="middle" font-size="11" fill="#e5e7eb" class="mono">add @claude</text>

    <text x="395" y="51" text-anchor="middle" font-size="18" fill="#4b5563">→</text>

    <rect x="410" y="20" width="180" height="50" rx="25" fill="#1f2430" stroke="#2f3542"/>
    <rect class="a pill2" x="410" y="20" width="180" height="50" rx="25" fill="#d97757"/>
    <text x="500" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2  Run</text>
    <text x="500" y="59" text-anchor="middle" font-size="11" fill="#e5e7eb" class="mono">/todoist-agent:run</text>

    <text x="605" y="51" text-anchor="middle" font-size="18" fill="#4b5563">→</text>

    <rect x="620" y="20" width="180" height="50" rx="25" fill="#1f2430" stroke="#2f3542"/>
    <rect class="a pill3" x="620" y="20" width="180" height="50" rx="25" fill="#16a34a"/>
    <text x="710" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3  Review</text>
    <text x="710" y="59" text-anchor="middle" font-size="11" fill="#e5e7eb" class="mono">in Todoist</text>
  </g>

  <!-- Todoist panel -->
  <g>
    <rect x="40" y="90" width="390" height="300" rx="14" fill="#ffffff"/>
    <path d="M40 104 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v26 h-390 z" fill="#f7f7f7"/>
    <line x1="40" y1="130" x2="430" y2="130" stroke="#eaeaea"/>
    <circle cx="64" cy="110" r="10" fill="#e44332"/>
    <path d="M59 110 l3.5 3.5 l6.5 -7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="115" font-size="15" font-weight="700" fill="#202020">Todoist</text>
    <text x="412" y="115" text-anchor="end" font-size="12" fill="#9a9a9a">the portal</text>

    <g class="a task">
      <circle cx="68" cy="160" r="9" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
      <text x="88" y="165" font-size="15" fill="#202020">Compare standing desks under $500</text>
      <text x="88" y="186" font-size="12" fill="#8a8a8a">Goal · Done when · Folder: home-office</text>

      <g class="a chip1">
        <rect x="88" y="198" width="74" height="22" rx="11" fill="#af38eb"/>
        <text x="125" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">@claude</text>
      </g>
      <g class="a chip2">
        <rect x="88" y="198" width="128" height="22" rx="11" fill="#eb96eb"/>
        <text x="152" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#4a0f4a">@claude-working</text>
      </g>
      <g class="a chip3">
        <rect x="88" y="198" width="54" height="22" rx="11" fill="#ff9933"/>
        <text x="115" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">@you</text>
      </g>
    </g>

    <g class="a comment">
      <rect x="60" y="238" width="350" height="132" rx="10" fill="#f4f4f5"/>
      <circle cx="82" cy="261" r="9" fill="#16a34a"/>
      <path d="M77.5 261 l3 3 l5.5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="99" y="266" font-size="13" font-weight="700" fill="#202020">Claude · Ready for review</text>
      <text x="76" y="292" font-size="12" fill="#444">Top 3 desks with prices, links, and a pick.</text>
      <text x="76" y="314" font-size="11" fill="#666" class="mono">home-office/desk-comparison.md</text>
      <line x1="76" y1="330" x2="394" y2="330" stroke="#e4e4e7"/>
      <text x="76" y="352" font-size="11" fill="#8a8a8a">Not quite? Comment + @claude, and it goes again.</text>
    </g>
  </g>

  <!-- arrows -->
  <g>
    <line x1="442" y1="175" x2="552" y2="175" stroke="#3a4150" stroke-width="2"/>
    <path d="M552 169 l8 6 l-8 6 z" fill="#3a4150"/>
    <text x="500" y="162" text-anchor="middle" font-size="11" fill="#6b7280">task</text>
    <circle class="a dotTop" cx="444" cy="175" r="6" fill="#af38eb"/>

    <line x1="448" y1="305" x2="558" y2="305" stroke="#3a4150" stroke-width="2"/>
    <path d="M448 299 l-8 6 l8 6 z" fill="#3a4150"/>
    <text x="500" y="292" text-anchor="middle" font-size="11" fill="#6b7280">result</text>
    <circle class="a dotBot" cx="556" cy="305" r="6" fill="#16a34a"/>
  </g>

  <!-- Claude Code panel -->
  <g>
    <rect x="570" y="90" width="390" height="300" rx="14" fill="#1b1b1d" stroke="#2c2c30"/>
    <line x1="570" y1="130" x2="960" y2="130" stroke="#2c2c30"/>
    <circle cx="594" cy="110" r="10" fill="#d97757"/>
    <path d="M594 103 v14 M587 110 h14 M589 105 l10 10 M599 105 l-10 10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="612" y="115" font-size="15" font-weight="700" fill="#f5f5f5">Claude Code</text>
    <text x="942" y="115" text-anchor="end" font-size="12" fill="#7a7a80">your machine · your plan</text>

    <g class="a term">
      <text x="592" y="162" font-size="13" class="mono" fill="#e5e5e5"><tspan fill="#d97757">&gt;</tspan> /todoist-agent:run</text>
      <rect class="a cover" x="588" y="146" width="180" height="24" fill="#1b1b1d"/>

      <text class="a l2 mono" x="592" y="192" font-size="12" fill="#9ca3af">claimed 1 task · starting a worker</text>
      <text class="a l3" x="592" y="214" font-size="12" fill="#9ca3af"><tspan class="mono">reading web, Slack, CLAUDE.md…</tspan></text>
      <rect class="a l3" x="592" y="228" width="346" height="8" rx="4" fill="#2c2c30"/>
      <rect class="a bar" x="592" y="228" width="346" height="8" rx="4" fill="#d97757"/>

      <text class="a l4" x="592" y="266" font-size="12" fill="#86efac"><tspan class="mono">✓ wrote home-office/desk-comparison.md</tspan></text>
      <text class="a l5" x="592" y="290" font-size="12" fill="#86efac"><tspan class="mono">✓ posted result · label → @you</tspan></text>
    </g>

    <line x1="592" y1="330" x2="938" y2="330" stroke="#2c2c30"/>
    <text x="592" y="352" font-size="11" fill="#7a7a80">Reads your tools. Never sends, shares, deletes, or pushes.</text>
    <text x="592" y="372" font-size="11" fill="#7a7a80">Files land in the task's project folder.</text>
  </g>

  <!-- caption -->
  <text x="500" y="428" text-anchor="middle" font-size="15" fill="#e5e7eb">Todoist is the portal. Claude Code does the work, on your machine, with your Claude plan.</text>
  <text x="500" y="452" text-anchor="middle" font-size="12" fill="#6b7280">You label, you run, you review. That's it.</text>
</svg>
