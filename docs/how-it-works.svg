<text x="500" y="508" text-anchor="middle" font-size="15" fill="#e5e7eb">Todoist is the portal. Claude Code does the work, on your machine, with your Claude plan.</text>
<text x="500" y="533" text-anchor="middle" font-size="12" fill="#6b7280">Research, follow-ups from your meetings and Slack, code on a branch. You label, you run, you review.</text>
